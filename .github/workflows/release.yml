name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build release binary
        run: swift build -c release

      - name: Prepare binary
        run: cp .build/release/ai-usage-bar ai-usage-bar

      - name: Build app bundle
        run: ./Scripts/package_app.sh

      - name: Create app zip
        run: zip -r AIUsageBar.app.zip AIUsageBar.app

      - name: Compute SHA256 of binary
        id: sha
        run: echo "sha256=$(shasum -a 256 ai-usage-bar | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ai-usage-bar
            AIUsageBar.app.zip
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/reidemeister94/homebrew-tap.git tap-repo
          mkdir -p tap-repo/Formula

          cat > tap-repo/Formula/ai-usage-bar.rb << 'FORMULA'
          class AiUsageBar < Formula
            desc "macOS menu bar app for tracking Claude AI usage"
            homepage "https://github.com/reidemeister94/ai-usage-bar"
            url "https://github.com/reidemeister94/ai-usage-bar/releases/download/v${{ steps.version.outputs.version }}/ai-usage-bar"
            sha256 "${{ steps.sha.outputs.sha256 }}"
            license "MIT"

            depends_on macos: :sonoma
            depends_on arch: :arm64

            def install
              bin.install "ai-usage-bar"
            end
          end
          FORMULA

          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ai-usage-bar.rb
          git commit -m "Update ai-usage-bar to ${{ steps.version.outputs.version }}"
          git push
