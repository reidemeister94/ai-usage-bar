name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build app bundle
        run: ./Scripts/package_app.sh

      - name: Create zip
        run: zip -r AIUsageBar.app.zip AIUsageBar.app

      - name: Compute SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 AIUsageBar.app.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AIUsageBar.app.zip
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/reidemeister94/homebrew-tap.git tap-repo
          mkdir -p tap-repo/Casks

          cat > tap-repo/Casks/ai-usage-bar.rb << FORMULA
          cask "ai-usage-bar" do
            version "${{ steps.version.outputs.version }}"
            sha256 "${{ steps.sha.outputs.sha256 }}"

            url "https://github.com/reidemeister94/ai-usage-bar/releases/download/v#{version}/AIUsageBar.app.zip"
            name "AI Usage Bar"
            desc "macOS menu bar app for tracking Claude AI usage"
            homepage "https://github.com/reidemeister94/ai-usage-bar"

            app "AIUsageBar.app"

            zap trash: [
              "~/Library/Preferences/com.ai-usage-bar.app.plist",
              "~/Library/Application Support/AIUsageBar",
            ]
          end
          FORMULA

          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/ai-usage-bar.rb
          git commit -m "Update ai-usage-bar to ${{ steps.version.outputs.version }}"
          git push
